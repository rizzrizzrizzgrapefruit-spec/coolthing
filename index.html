function cleanupOldMessages() {
    const cutoff = Date.now() - (24 * 60 * 60 * 1000); // 24 hours

    function sendMsg() {

function sendImage(base64Image) {
    const colorInput = document.getElementById('name-color-picker');

    chatRef.push({
        username: username,
        image: base64Image,
        color: colorInput.value,
        timestamp: Date.now()
    });
}


function toggleNotifications() {
    const btn = document.getElementById('notif-btn');

    if (!("Notification" in window)) {
        alert("Your browser does not support notifications.");
        return;
    }

    // TURN ON
    if (!notificationsEnabled) {
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notificationsEnabled = true;
                localStorage.setItem('notificationsEnabled', 'true');
                btn.textContent = "DISABLE DESKTOP NOTIFICATIONS";
                alert("Notifications enabled!");
            } else {
                alert("Notifications denied.");
            }
        });
    } 
    // TURN OFF
    else {
        notificationsEnabled = false;
        localStorage.setItem('notificationsEnabled', 'false');
        btn.textContent = "ENABLE DESKTOP NOTIFICATIONS";
        alert("Notifications disabled.");
    }
}
    function exportData() {
        const data = {
            username: username,
            color: document.getElementById('name-color-picker').value,
            tabTitle: document.title
        };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gplus_data.json';
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.username) {
                    username = data.username;
                    document.getElementById('current-username').innerText = username;
                }
                if(data.color) {
                    document.getElementById('name-color-picker').value = data.color;
                }
                if(data.tabTitle) {
                    document.title = data.tabTitle;
                }
                updatePresence();
                alert("Data imported successfully!");
            } catch(err) { alert("Error importing data."); }
        };
        reader.readAsText(file);
    }
// PASTE IMAGE FROM CLIPBOARD
document.getElementById('chat-input').addEventListener('paste', function(event) {
    const items = event.clipboardData.items;

    for (let i = 0; i < items.length; i++) {
        if (items[i].type.includes("image")) {
            const file = items[i].getAsFile();

            // size limit (prevents lag)
            if (file.size > 400000) {
                alert("Image too large! Keep it under ~400KB.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                sendImage(e.target.result);
            };

            reader.readAsDataURL(file);
        }
    }
});
